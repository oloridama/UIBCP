name: Export Poseidon Constants

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allows manual trigger

jobs:
  export-constants:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.67.0  # Matches Winterfell 0.6.4 requirement
          default: true
          profile: minimal

      - name: Build project
        run: cargo build --release

      - name: Run export script
        run: cargo run --release --bin export_poseidon > poseidon_constants.txt

      - name: Upload constants
        uses: actions/upload-artifact@v4
        with:
          name: poseidon-constants
          path: poseidon_constants.txt
