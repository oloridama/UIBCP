name: Export Poseidon Constants

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  export-constants:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.79.0

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Build project
        run: cargo build --release

      - name: Run export script
        run: cargo run --release --bin export_poseidon > poseidon_constants.txt

      - name: Upload constants
        uses: actions/upload-artifact@v4
        with:
          name: poseidon-constants
          path: poseidon_constants.txt
