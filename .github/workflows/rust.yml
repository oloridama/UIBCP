name: Export Poseidon Constants
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  export-constants:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.79.0

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # This new step will manually run protoc to show us any hidden errors.
      - name: Debug Protobuf compilation
        run: |
          set -o pipefail
          echo "Running Protobuf compiler..."
          protoc \
            --prost_out=. \
            --include_imports \
            --include_source_info \
            --proto_path=proto \
            uibc/v1/uibc.proto 2>&1 | tee protoc_output.log
          
      - name: Build project
        run: cargo build --release

      - name: Run export script
        run: cargo run --release --bin export_poseidon > poseidon_constants.txt

      - name: Upload constants
        uses: actions/upload-artifact@v4
        with:
          name: poseidon-constants
          path: poseidon_constants.txt
