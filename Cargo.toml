[package]
name = "uibcp"
version = "0.1.0"
edition = "2021"

[dependencies]
# Winterfell STARK Prover dependencies
winter-air = { version = "0.9.0", default-features = false }
winter-crypto = { version = "0.9.0", default-features = false }
winter-math = { version = "0.9.0", default-features = false }
winterfell = { version = "0.9.0", default-features = false }

# For ABI encoding
ethabi = "17.2.0"

# For error handling
anyhow = "1.0.83"

# For Protocol Buffers (Prost) and Serde compatibility
prost = "0.12"
serde = { version = "1.0.219", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0.120"

# For validation attributes in build.rs
validator = { version = "0.18", features = ["derive"] }

[build-dependencies]
# This crate is only used by your build.rs script
prost-build = "0.12"

[lib]
name = "uibcp"
path = "relayer/src/lib.rs"

[[bin]]
name = "export_poseidon"
path = "scripts/export_poseidon.rs"
