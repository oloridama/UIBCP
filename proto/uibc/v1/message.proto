syntax = "proto3";

package uibc.v1;

import "uibc/v1/proof.proto";
import "uibc/v1/common.proto";

// COMPLETED: Missing MessageFees definition
message MessageFees {
  uibc.v1.Fee base_fee = 1;           // Basic relayer operational cost
  uibc.v1.Fee complexity_fee = 2;     // Based on message size/complexity  
  uibc.v1.Fee verification_fee = 3;   // Proof verification cost
  uibc.v1.Fee destination_fee = 4;    // Destination chain specific costs
  uibc.v1.Fee priority_fee = 5;       // For priority processing (optional)
  uibc.v1.Fee timeout_insurance = 6;  // Insurance for timeout handling (optional)
  uibc.v1.Fee total_fee = 7;         // Sum of all fees above
  
  // NEW: Fee distribution breakdown for relayer economics
  FeeDistribution distribution = 8;
}

// NEW: Fee distribution model for sustainable economics
message FeeDistribution {
  uint32 relayer_share_bps = 1;    // Basis points (e.g., 5000 = 50%)
  uint32 protocol_share_bps = 2;   // Protocol treasury share
  uint32 verifier_share_bps = 3;   // Proof verifier rewards
  uint32 validator_share_bps = 4;  // Validator/sequencer rewards (if applicable)
  
  // NEW: Performance bonuses to incentivize good relayer behavior
  repeated PerformanceBonus bonuses = 5;
}

// NEW: Performance-based incentives
message PerformanceBonus {
  PerformanceMetric metric = 1;
  uint32 threshold_bps = 2;        // Threshold in basis points (e.g., 9500 = 95%)
  uint32 bonus_percentage = 3;     // Bonus percentage (e.g., 20 = 20% extra)
}

enum PerformanceMetric {
  PERFORMANCE_METRIC_UNSPECIFIED = 0;
  PERFORMANCE_METRIC_SUCCESS_RATE = 1;      // % of successful deliveries
  PERFORMANCE_METRIC_LATENCY = 2;           // Average delivery time
  PERFORMANCE_METRIC_UPTIME = 3;            // Relayer availability %
  PERFORMANCE_METRIC_VOLUME = 4;            // Total value processed
}

// ENHANCED: TokenTransfer with string amounts for large numbers (DeFi compatibility)
message TokenTransfer {
  string denom = 1;         // Token denomination (e.g., "uatom", "ibc/ABC123...")
  string amount = 2;        // Amount as string for arbitrary precision (handles DeFi amounts)
  string sender = 3;        // Sender address (chain-specific format)
  string receiver = 4;      // Receiver address (chain-specific format)
  string memo = 5;          // Optional memo/data
  
  // NEW: Additional transfer metadata for complex transfers
  TransferMetadata metadata = 6;
}

// NEW: Transfer metadata for IBC tracing and bridge fees
message TransferMetadata {
  bool is_ibc_token = 1;           // True if this is an IBC-wrapped token
  repeated string trace_path = 2;   // IBC trace path (e.g., ["transfer", "channel-0"])
  string original_denom = 3;        // Original denomination before IBC wrapping
  uibc.v1.Fee bridge_fee = 4;      // Additional bridge fee (if applicable, using proof.proto's Fee)
}

// NEW: Batch transfer for efficiency and cost reduction
message BatchTransfer {
  repeated TokenTransfer transfers = 1;
  bool atomic_execution = 2;        // All transfers succeed or all fail
  string batch_memo = 3;            // Memo for the entire batch
  uint64 max_batch_timeout = 4;     // Maximum time to complete all transfers
}

// ENHANCED: ContractCall with metadata for complex operations
message ContractCall {
  bytes target_contract = 1; // Contract to call on destination (e.g., 20-byte EVM address)
  bytes function_selector = 2; // Function signature hash (4-byte)
  bytes call_data = 3;       // ABI-encoded call data
  string value = 4;          // Native token value to send (string for precision)
  
  // NEW: Enhanced contract call metadata
  ContractCallMetadata metadata = 5;
}

// NEW: Contract call metadata for permissions and optimization
message ContractCallMetadata {
  uint64 gas_limit = 1;             // Gas limit for execution
  string contract_standard = 2;     // "ERC20", "ERC721", "CW20", etc.
  repeated string required_permissions = 3; // Required permissions/capabilities
  uint32 call_priority = 4;         // Priority for execution ordering
  bytes access_list = 5;            // EIP-2930 access list (for EVM)
}

// ENHANCED: StateQuery with metadata
message StateQuery {
  bytes storage_key = 1;   // Key to query in destination chain state
  uibc.v1.ProofType proof_type = 2; // What kind of proof is needed
  
  // NEW: Query metadata for optimization
  StateQueryMetadata metadata = 3;
}

// NEW: State query metadata for specific queries
message StateQueryMetadata {
  string storage_type = 1;          // "account", "contract", "validator", etc.
  uint64 query_height = 2;          // Specific height to query (0 = latest)
  bool include_proof = 3;           // Whether to include merkle proof
}

// ENHANCED: Acknowledgment with metadata
message Acknowledgment {
  bytes original_message_id = 1; // 32-byte hash
  bool success = 2;
  bytes result_data = 3; // Execution result if successful
  uint32 error_code = 4;
  string error_message = 5;
  
  // NEW: Acknowledgment metadata for analytics
  AckMetadata metadata = 6;
}

// NEW: Acknowledgment metadata for performance tracking
message AckMetadata {
  uint64 processed_at = 1;          // When the original message was processed
  uint64 gas_used = 2;              // Gas consumed during processing
  uibc.v1.Fee actual_fee = 3;       // Actual fee charged (using proof.proto's Fee)
  bytes relayer_address = 4;        // Address of relayer who processed the message
}

// ENHANCED: Error with context for debugging
message Error {
  bytes original_message_id = 1; // 32-byte hash
  uibc.v1.ErrorType error_type = 2;
  string description = 3;
  
  // NEW: Error context for better debugging
  ErrorContext context = 4;
}

// NEW: Error context for debugging and retry logic
message ErrorContext {
  uint64 failed_at_height = 1;      // Height where error occurred
  string failed_at_chain = 2;       // Chain where error occurred
  bytes failed_step = 3;            // Which processing step failed
  bool retryable = 4;               // Whether this error is retryable
}

enum ProofType {
  PROOF_TYPE_UNSPECIFIED = 0;
  PROOF_TYPE_MERKLE_INCLUSION = 1;
  PROOF_TYPE_MERKLE_EXCLUSION = 2;
  PROOF_TYPE_STATE_TRANSITION = 3;
  PROOF_TYPE_EXECUTION_RESULT = 4;
  PROOF_TYPE_VALIDATOR_SET = 5;      // NEW: For validator set changes
  PROOF_TYPE_CONSENSUS = 6;          // NEW: For consensus-related proofs
}

enum ErrorType {
  ERROR_TYPE_UNSPECIFIED = 0;
  ERROR_TYPE_TIMEOUT = 1;
  ERROR_TYPE_INVALID_DESTINATION = 2;
  ERROR_TYPE_INSUFFICIENT_FEES = 3;
  ERROR_TYPE_EXECUTION_FAILED = 4;
  ERROR_TYPE_PROOF_VERIFICATION_FAILED = 5;
  ERROR_TYPE_UNSUPPORTED_MESSAGE_TYPE = 6;
  ERROR_TYPE_INSUFFICIENT_BALANCE = 7;    // NEW: Sender lacks funds
  ERROR_TYPE_CONTRACT_NOT_FOUND = 8;      // NEW: Target contract doesn't exist
  ERROR_TYPE_SLASHING_CONDITION_MET = 9;  // NEW: Relayer slashing triggered
  ERROR_TYPE_CHANNEL_CLOSED = 10;         // NEW: IBC channel is closed
  ERROR_TYPE_RATE_LIMITED = 11;           // NEW: Too many messages from sender
}

// Relayer Economics & Assignment
message RelayerAssignment {
  bytes assigned_relayer = 1; // Pre-assigned relayer (optional, 20-byte EVM address)
  uint64 assignment_deadline = 2; // When assignment expires
  repeated bytes backup_relayers = 3; // Fallback relayers
  bool competitive_mode = 4; // Allow multiple relayers to compete
  
  // NEW: Assignment metadata for complex routing
  RelayerBond required_bond = 5;    // Bonding requirements
  RelayerSelection selection_criteria = 6; // How relayer was selected
}

// NEW: Relayer bonding system for security
message RelayerBond {
  uibc.v1.Fee minimum_bond = 1;     // Base bond requirement (using proof.proto's Fee)
  float value_multiplier = 2;       // Additional bond based on message value (e.g., 0.1 = 10%)
  uint64 lock_period_seconds = 3;   // How long bond is locked after message
  repeated SlashingCondition slashing_conditions = 4;
}

// NEW: Slashing conditions to prevent malicious behavior
message SlashingCondition {
  SlashingOffense offense = 1;
  uint32 slash_percentage = 2;      // Percentage of bond to slash (basis points)
  bytes evidence_required = 3;      // What evidence is needed for slashing
}

enum SlashingOffense {
  SLASHING_OFFENSE_UNSPECIFIED = 0;
  SLASHING_OFFENSE_INVALID_PROOF = 1;
  SLASHING_OFFENSE_MESSAGE_REPLAY = 2;
  SLASHING_OFFENSE_TIMEOUT_FRAUD = 3;
  SLASHING_OFFENSE_MALICIOUS_ROUTING = 4;
  SLASHING_OFFENSE_UNAVAILABILITY = 5;    // NEW: Relayer went offline
  SLASHING_OFFENSE_DOUBLE_SPENDING = 6;   // NEW: Attempted double-spend
}

// NEW: Relayer selection mechanism
message RelayerSelection {
  SelectionMethod method = 1;
  bytes selection_proof = 2;        // Proof of selection process (e.g., VRF)
  uint64 selected_at = 3;           // When selection occurred
}

enum SelectionMethod {
  SELECTION_METHOD_UNSPECIFIED = 0;
  SELECTION_METHOD_ROUND_ROBIN = 1;
  SELECTION_METHOD_LOWEST_FEE = 2;
  SELECTION_METHOD_HIGHEST_STAKE = 3;
  SELECTION_METHOD_REPUTATION_BASED = 4;
  SELECTION_METHOD_RANDOM_VRF = 5;        // Verifiable Random Function
  SELECTION_METHOD_USER_SPECIFIED = 6;    // User chose specific relayer
}

message EconomicParameters {
  uibc.v1.Fee estimated_value = 1;
  Priority priority = 2;
  uibc.v1.Fee max_total_fee = 3;
  FeePayment fee_payment = 4;
  uibc.v1.Fee timeout_compensation = 5;
  
  // NEW: Advanced economic parameters for complex scenarios
  IncentiveParameters incentives = 6;
}

// NEW: Incentive parameters for user loyalty and volume discounts
message IncentiveParameters {
  uibc.v1.Fee early_completion_bonus = 1;   // Bonus for completing before deadline
  uibc.v1.Fee volume_discount = 2;          // Discount for high-volume users
  string loyalty_program_id = 3;    // Loyalty program membership
  repeated string referral_codes = 4; // Referral codes for fee discounts
}

enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_LOW = 1;     // Best effort, lowest fees
  PRIORITY_NORMAL = 2;  // Standard processing
  PRIORITY_HIGH = 3;    // Fast processing, higher fees
  PRIORITY_CRITICAL = 4; // Immediate processing, premium fees
  PRIORITY_EMERGENCY = 5; // NEW: For emergency/rescue operations
}

message FeePayment {
  oneof payment_method {
    PrepaidFees prepaid = 1;
    PayOnDeliveryFees pay_on_delivery = 2;
    RelayerAdvancedFees relayer_advanced = 3;
    SubsidizedFees subsidized = 4;
    EscrowedFees escrowed = 5;      // NEW: Fees held in escrow
  }
}

message PrepaidFees {
  repeated uibc.v1.Fee fees_paid = 1;
  bytes payment_tx_hash = 2; // 32-byte hash
  uint64 paid_at_height = 3;        // NEW: Block height when payment was made
}

message PayOnDeliveryFees {
  bytes fee_escrow_address = 1; // 20-byte EVM address
  bytes escrow_proof = 2;
  uint64 escrow_timeout = 3;        // NEW: When escrow expires
}

message RelayerAdvancedFees {
  bytes reimbursement_guarantee = 1; // Signed guarantee
  bytes relayer_signature = 2;      // NEW: Relayer's agreement to advance fees
  uint64 reimbursement_deadline = 3; // NEW: When reimbursement is due
}

message SubsidizedFees {
  string subsidy_program_id = 1;
  bytes authorization_signature = 2; // NEW: Signature authorizing subsidy
  uibc.v1.Fee subsidy_amount = 3;   // NEW: Amount of subsidy applied
}

// NEW: Escrow-based fee payment for complex scenarios
message EscrowedFees {
  bytes escrow_contract = 1;        // Multi-sig or smart contract holding fees
  repeated bytes signers = 2;       // Required signers for fee release
  uint32 threshold = 3;             // Number of signatures required
  uint64 escrow_expiry = 4;         // When escrow automatically releases
}
