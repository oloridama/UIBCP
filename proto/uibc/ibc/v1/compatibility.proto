syntax = "proto3";

package uibc.ibc.v1;

// This import provides access to the shared 'Height' and other common messages.
// The "uibc/v1/common.proto" file contains the definition for the 'Height' message.
import "uibc/v1/common.proto";

// Code generation options
option go_package = "github.com/oloridama/UIBCP/proto/uibc/ibc/v1";
option java_package = "com.oloridama.uibcp.ibc.v1";
option java_multiple_files = true;
option java_outer_classname = "CompatibilityProto";
option csharp_namespace = "Uibcp.Ibc.V1";

// IBC compatibility data structure for cross-chain routing
message IbcCompatibilityData {
  // IBC Packet Fields
  uint64 sequence = 1;
  string source_port = 2;
  string source_channel = 3;
  string destination_port = 4;
  string destination_channel = 5;

  // Timeout Handling - using imported Height definition
  oneof timeout {
    // We must use the fully qualified name 'uibc.v1.Height' to specify the correct package.
    uibc.v1.Height timeout_height = 10;
    uint64 timeout_timestamp = 11;
  }

  // ICS-20 Token Transfer Extensions
  FungibleTokenPacket token_data = 12;

  // Other IBC application data
  bytes ics27_data = 13;
  bytes custom_app_data = 14;

  // Connection and client information
  ConnectionInfo connection_info = 15;
  ClientInfo client_info = 16;
}

// Complete fungible token packet data
message FungibleTokenPacket {
  string denom = 1;
  string amount = 2;
  string sender = 3;
  string receiver = 4;
  string memo = 5;
  TokenMetadata metadata = 6;
}

// Token metadata for IBC token tracing
message TokenMetadata {
  bool is_native = 1;
  repeated string trace_path = 2;
  string base_denom = 3;
  uint32 decimals = 4;
  string token_standard = 5;
}

// Connection information for proof verification
message ConnectionInfo {
  string connection_id = 1;
  string client_id = 2;
  string counterparty_connection_id = 3;
  string counterparty_client_id = 4;
  ConnectionState state = 5;
}

enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;
  CONNECTION_STATE_INIT = 1;
  CONNECTION_STATE_TRYOPEN = 2;
  CONNECTION_STATE_OPEN = 3;
}

// Client information for light client verification
message ClientInfo {
  string client_id = 1;
  string client_type = 2;
  // We must use the fully qualified name 'uibc.v1.Height' here as well.
  uibc.v1.Height latest_height = 3;
  bytes consensus_state = 4;
  bytes client_state = 5;
  bool frozen = 6;
}

// IBC channel information
message ChannelInfo {
  string channel_id = 1;
  string port_id = 2;
  ChannelState state = 3;
  ChannelOrdering ordering = 4;
  string counterparty_channel_id = 5;
  string counterparty_port_id = 6;
  string connection_hops = 7;
  string version = 8;
}

enum ChannelState {
  CHANNEL_STATE_UNSPECIFIED = 0;
  CHANNEL_STATE_INIT = 1;
  CHANNEL_STATE_TRYOPEN = 2;
  CHANNEL_STATE_OPEN = 3;
  CHANNEL_STATE_CLOSED = 4;
}

enum ChannelOrdering {
  CHANNEL_ORDERING_UNSPECIFIED = 0;
  CHANNEL_ORDERING_UNORDERED = 1;
  CHANNEL_ORDERING_ORDERED = 2;
}

// Acknowledgment data structure for IBC
message IbcAcknowledgement {
  oneof response {
    bytes result = 1;
    string error = 2;
  }
}

// Packet commitment for proof generation
message PacketCommitment {
  bytes data = 1;
  uint64 timeout_height = 2;
  uint64 timeout_timestamp = 3;
}

// Packet receipt for ordered channels
message PacketReceipt {
  string port_id = 1;
  string channel_id = 2;
  uint64 sequence = 3;
  bool received = 4;
}

// Next sequence receive for ordered channels
message NextSequenceReceive {
  string port_id = 1;
  string channel_id = 2;
  uint64 next_sequence_receive = 3;
}
