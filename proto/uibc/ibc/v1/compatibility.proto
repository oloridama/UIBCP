syntax = "proto3";

package uibc.ibc.v1;

import "uibc/v1/common.proto";

// Extends UniversalMessage.ibc_data field
message IbcCompatibilityData {
  // IBC Packet Fields
  uint64 sequence = 1;
  string source_port = 2;
  string source_channel = 3;
  string destination_port = 4;
  string destination_channel = 5;

  // Timeout Handling
  oneof timeout {
    Height timeout_height = 10;
    uint64 timeout_timestamp = 11;
  }

  // ICS-20 Token Transfer Extensions
  FungibleTokenPacket token_data = 12;  // ENHANCED: Made this a proper message field
  
  // Other IBC application data
  bytes ics27_data = 13;                // Interchain accounts
  bytes custom_app_data = 14;           // NEW: For custom IBC applications
  
  // NEW: Connection and client information for verification
  ConnectionInfo connection_info = 15;
  ClientInfo client_info = 16;
}

// ENHANCED: Complete fungible token packet data
message FungibleTokenPacket {
  string denom = 1;
  string amount = 2;  // String for arbitrary precision
  string sender = 3;
  string receiver = 4;
  string memo = 5;    // NEW: Memo field for additional data
  
  // NEW: Token metadata for complex transfers
  TokenMetadata metadata = 6;
}

// NEW: Token metadata for IBC token tracing
message TokenMetadata {
  bool is_native = 1;                   // True if token is native to source chain
  repeated string trace_path = 2;       // Full IBC trace path
  string base_denom = 3;               // Original denomination
  uint32 decimals = 4;                 // Token decimals
  string token_standard = 5;           // "ICS20", "CW20", "ERC20", etc.
}

// NEW: Connection information for proof verification
message ConnectionInfo {
  string connection_id = 1;
  string client_id = 2;
  string counterparty_connection_id = 3;
  string counterparty_client_id = 4;
  ConnectionState state = 5;
}

enum ConnectionState {
  CONNECTION_STATE_UNSPECIFIED = 0;
  CONNECTION_STATE_INIT = 1;
  CONNECTION_STATE_TRYOPEN = 2;
  CONNECTION_STATE_OPEN = 3;
}

// NEW: Client information for light client verification
message ClientInfo {
  string client_id = 1;
  string client_type = 2;             // "07-tendermint", "10-grandpa", etc.
  Height latest_height = 3;
  bytes consensus_state = 4;          // Serialized consensus state
  bytes client_state = 5;             // Serialized client state
  bool frozen = 6;                    // Whether client is frozen
}

// NEW: IBC channel information
message ChannelInfo {
  string channel_id = 1;
  string port_id = 2;
  ChannelState state = 3;
  ChannelOrdering ordering = 4;
  string counterparty_channel_id = 5;
  string counterparty_port_id = 6;
  string connection_hops = 7;         // Connection ID used by this channel
  string version = 8;                 // Channel version
}

enum ChannelState {
  CHANNEL_STATE_UNSPECIFIED = 0;
  CHANNEL_STATE_INIT = 1;
  CHANNEL_STATE_TRYOPEN = 2;
  CHANNEL_STATE_OPEN = 3;
  CHANNEL_STATE_CLOSED = 4;
}

enum ChannelOrdering {
  CHANNEL_ORDERING_UNSPECIFIED = 0;
  CHANNEL_ORDERING_UNORDERED = 1;
  CHANNEL_ORDERING_ORDERED = 2;
}

// NEW: Acknowledgment data structure for IBC
message IbcAcknowledgement {
  oneof response {
    bytes result = 1;                 // Success result
    string error = 2;                 // Error message
  }
}

// NEW: Packet commitment for proof generation
message PacketCommitment {
  bytes data = 1;                     // Packet data hash
  uint64 timeout_height = 2;
  uint64 timeout_timestamp = 3;
}

// NEW: Packet receipt for ordered channels
message PacketReceipt {
  string port_id = 1;
  string channel_id = 2;
  uint64 sequence = 3;
  bool received = 4;
}

// NEW: Next sequence receive for ordered channels
message NextSequenceReceive {
  string port_id = 1;
  string channel_id = 2;
  uint64 next_sequence_receive = 3;
}

// Extend UniversalMessage to include IbcCompatibilityData
extend uibc.v1.UniversalMessage {
  IbcCompatibilityData ibc_data = 40;
}
